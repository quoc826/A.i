spring.application.name=SpringAi
spring.config.import=optional:file:./.env[.properties]
server.port=8080
# Local development: allow RSA key retrieval for caching_sha2_password authentication.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/shoppingdb?allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:sapassword}
spring.jpa.hibernate.ddl-auto=update
# The local server is MySQL 8. Set DB_DIALECT=org.hibernate.dialect.MariaDBDialect for MariaDB.
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
server.error.include-stacktrace=never
server.error.include-message=never
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
spring.messages.basename=home
spring.ai.model.chat=${AI_CHAT_MODEL:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.model.embedding=${AI_EMBEDDING_MODEL:none}
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.openai.embedding.options.dimensions=1536
spring.ai.retry.max-attempts=2
app.ai.enabled=false
app.ai.vector-store=simple
app.ai.index-directory=./data/vector-index
app.ai.sync-delay-ms=60000
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
app.seed-demo=${SEED_DEMO:false}
