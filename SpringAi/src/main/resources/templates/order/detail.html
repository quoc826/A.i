<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments :: head}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main><h1 th:text="|Đơn hàng #${order.id}|"></h1><p th:text="${order.customer.name}"></p><p th:text="${order.date}"></p><p th:text="${order.status}"></p><table><thead><tr><th>Sản phẩm</th><th>Số lượng</th><th>Giá lúc mua</th><th>Thành tiền</th></tr></thead><tbody><tr th:each="line : ${order.orderLines}"><td th:text="${line.product.name}"></td><td th:text="${line.amount}"></td><td th:text="${line.purchasePrice}"></td><td th:text="${line.subtotal}"></td></tr></tbody></table><h2 th:text="|Tổng: ${order.total} USD|"></h2><section sec:authorize="hasRole('ADMIN')"><form th:action="@{/admin/order/{id}/update(id=${order.id})}" method="post"><label>Ngày<input type="date" name="date" th:value="${order.date}" required></label><label>Trạng thái<select name="status"><option th:each="s : ${ {'PLACED','PROCESSING','COMPLETED'} }" th:value="${s}" th:text="${s}" th:selected="${s == order.status}"></option></select></label><button>Cập nhật</button></form><form th:action="@{/admin/order/{id}/lock(id=${order.id})}" method="post"><button>Khóa đơn hàng</button></form></section></main></body></html>
