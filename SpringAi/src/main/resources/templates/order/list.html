<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments :: head}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main><h1>Đơn hàng</h1><a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/order/add}">Tạo đơn hàng</a><p th:if="${#lists.isEmpty(orders)}">Chưa có đơn hàng.</p><table><thead><tr><th>Mã</th><th>Ngày</th><th>Khách hàng</th><th>Trạng thái</th><th>Tổng</th></tr></thead><tbody><tr th:each="o : ${orders}"><td><a th:href="@{/order/{id}(id=${o.id})}" th:text="${o.id}"></a></td><td th:text="${o.date}"></td><td th:text="${o.customer.name}"></td><td th:text="${o.status}"></td><td th:text="${o.total}"></td></tr></tbody></table></main></body></html>
