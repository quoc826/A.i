<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments :: head}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main><h1>Đăng nhập</h1><p th:if="${param.error}" class="error">Sai tài khoản, mật khẩu hoặc tài khoản đã khóa.</p><p th:if="${param.logout}">Đã đăng xuất.</p><form th:action="@{/login}" method="post"><label>Tên đăng nhập<input name="username" autocomplete="username" required></label><label>Mật khẩu<input type="password" name="password" autocomplete="current-password" required></label><button>Đăng nhập</button></form></main></body></html>
