<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments :: head}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main><h1>Giỏ hàng</h1><p th:if="${#lists.isEmpty(rows)}">Giỏ hàng đang trống.</p><article th:each="row : ${rows}"><h2 th:text="${row.product.name}"></h2><p th:text="|${row.subtotal} USD|"></p><form th:action="@{/cart/update}" method="post"><input type="hidden" name="productId" th:value="${row.product.id}"><input aria-label="Số lượng" type="number" name="quantity" min="1" th:max="${row.product.quantity}" th:value="${row.quantity}" required><button>Cập nhật</button></form><form th:action="@{/cart/remove}" method="post"><input type="hidden" name="productId" th:value="${row.product.id}"><button>Xóa khỏi giỏ</button></form></article><h2 th:text="|Tổng: ${total} USD|"></h2><form th:if="${!#lists.isEmpty(rows)}" th:action="@{/cart/checkout}" th:object="${checkoutForm}" method="post"><label>Ngày đặt hàng<input type="date" th:field="*{date}" required></label><button>Đặt hàng</button></form></main></body></html>
