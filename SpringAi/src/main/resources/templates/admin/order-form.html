<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments :: head}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main><h1>Tạo đơn hàng</h1><p>Có thể đặt nhiều sản phẩm qua giỏ hàng của tài khoản khách hàng.</p><form th:action="@{/admin/order/save}" method="post"><label>Khách hàng<select name="customerId"><option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name}"></option></select></label><label>Sản phẩm<select name="productId"><option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name}"></option></select></label><label>Số lượng<input type="number" name="quantity" min="1" value="1" required></label><label>Ngày<input type="date" name="date" required></label><button>Tạo đơn hàng</button></form></main></body></html>
