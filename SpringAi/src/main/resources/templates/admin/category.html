<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments :: head}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main><h1>Danh mục</h1><form th:action="@{/admin/category/save}" th:object="${category}" method="post"><input type="hidden" th:field="*{id}"><label>Tên danh mục<input th:field="*{name}" required></label><p class="error" th:errors="*{name}"></p><button>Lưu</button></form><article th:each="c : ${categories}"><span th:text="${c.name}"></span><span th:if="${!c.active}"> — Đã khóa</span><a th:href="@{/admin/category/{id}(id=${c.id})}">Sửa</a><form th:if="${c.active}" th:action="@{/admin/category/{id}/lock(id=${c.id})}" method="post"><button>Khóa</button></form></article></main></body></html>
