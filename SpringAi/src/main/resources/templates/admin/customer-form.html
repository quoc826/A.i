<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments :: head}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main><h1>Thông tin khách hàng</h1><form th:action="@{/admin/customer/save}" th:object="${customerForm}" method="post"><input type="hidden" th:field="*{customer.id}"><label>Họ tên<input th:field="*{customer.name}" required></label><label>Ngày tham gia<input type="date" th:field="*{customer.customerSince}" required></label><label>Email Gmail<input type="email" th:field="*{customer.email}" required></label><label>Tên đăng nhập<input th:field="*{username}" required></label><label>Mật khẩu (để trống khi giữ mật khẩu cũ)<input type="password" th:field="*{password}" autocomplete="new-password"></label><p class="error" th:each="e : ${#fields.allErrors()}" th:text="${e}"></p><button>Lưu</button></form></main></body></html>
