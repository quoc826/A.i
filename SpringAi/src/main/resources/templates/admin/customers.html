<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments :: head}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main><h1>Khách hàng</h1><a th:href="@{/admin/customer/add}">Thêm khách hàng</a><article th:each="c : ${customers}"><h2 th:text="${c.name}"></h2><p th:text="${c.email}"></p><p th:text="${c.customerSince}"></p><span th:if="${!c.active}">Đã khóa</span><a th:href="@{/admin/customer/{id}(id=${c.id})}">Sửa</a><form th:if="${c.active}" th:action="@{/admin/customer/{id}/lock(id=${c.id})}" method="post"><button>Khóa tài khoản</button></form></article></main></body></html>
