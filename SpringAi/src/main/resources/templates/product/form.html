<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments :: head}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main><h1>Thông tin sản phẩm</h1><form th:action="@{/product/save}" th:object="${product}" method="post" enctype="multipart/form-data"><input type="hidden" th:field="*{id}"><label>Tên<input th:field="*{name}" required></label><p class="error" th:errors="*{name}"></p><label>Giá (USD)<input type="number" step="0.01" min="0.01" th:field="*{price}" required></label><p class="error" th:errors="*{price}"></p><label>Số lượng<input type="number" min="1" th:field="*{quantity}" required></label><p class="error" th:errors="*{quantity}"></p><label>Danh mục<select th:field="*{category}" required><option value="">Chọn danh mục</option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option></select></label><p class="error" th:errors="*{category}"></p><label>Thương hiệu<input th:field="*{brand}" maxlength="100"></label><label>Mô tả<textarea th:field="*{description}" maxlength="4000"></textarea></label><p class="error" th:errors="*{description}"></p><label>Thông số, đặc điểm<textarea th:field="*{specifications}" maxlength="2000"></textarea></label><p class="error" th:errors="*{specifications}"></p><label>Ảnh (tối đa 2MB)<input type="file" name="fileImage" accept="image/png,image/jpeg"></label><button>Lưu</button></form></main></body></html>
