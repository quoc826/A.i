<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments :: head}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main><span id="product-context" hidden th:data-product-id="${product.id}"></span><h1 th:text="${product.name}"></h1><p th:if="${product.brand}" th:text="${product.brand}"></p><p th:text="${product.description}"></p><p th:text="${product.specifications}"></p><img class="product-image" th:if="${product.image != null}" th:src="@{/uploads/{image}(image=${product.image})}" alt="Ảnh sản phẩm"><p><span th:text="${product.price}"></span> USD</p><p th:text="|Tồn kho: ${product.quantity}|"></p><form sec:authorize="hasRole('CUSTOMER')" th:action="@{/cart/add}" method="post"><input type="hidden" name="productId" th:value="${product.id}"><label>Số lượng<input type="number" name="quantity" value="1" min="1" th:max="${product.quantity}" required></label><button th:disabled="${!product.inStock}">Thêm vào giỏ</button></form><h2>Bình luận</h2><p th:if="${#lists.isEmpty(product.comments)}">Chưa có bình luận.</p><article th:each="c : ${product.comments}"><strong th:text="${c.customer.name}"></strong><p th:text="${c.text}"></p></article><form sec:authorize="hasRole('CUSTOMER')" th:action="@{/product/{id}/comment(id=${product.id})}" th:object="${commentForm}" method="post"><textarea th:field="*{text}" maxlength="1000" required></textarea><p class="error" th:errors="*{text}"></p><button>Gửi bình luận</button></form></main></body></html>
